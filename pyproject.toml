[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "1.0.0"
description = "Structural arbitrage detection and market-coherence research for prediction markets"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Goktug Bas" }]
dependencies = [
    "cryptography>=43,<47",
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
    "networkx>=3.3,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<22",
    "pydantic>=2.9,<3",
    "pytz>=2024,<2028",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "rich>=13,<15",
    "scipy>=1.14,<2",
    "typer>=0.12,<1",
    "websockets>=13,<17",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112,<7",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "types-networkx>=3.3,<4",
    "types-PyYAML>=6.0.12,<7",
]
semantic = [
    "openai>=1.50,<3",
    "sentence-transformers>=3,<6",
]

[project.scripts]
arbiter = "arbiter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
pretty = true
show_error_codes = true
warn_unreachable = true
